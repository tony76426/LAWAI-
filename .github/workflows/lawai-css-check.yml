name: Verify LawAI CSS source and production bundle
on:
  push:
    paths:
      - 'lawai_contral.css'
      - 'lawai_contral.min.css'
      - 'scripts/build-css.mjs'
      - 'scripts/verify-homepage.mjs'
      - 'index.html'
      - 'lawai_feature_glass.css'
      - 'lawai_footer_premium.css'
      - 'lawai_home_header.css'
      - 'lawai_header_premium.css'
      - 'scripts/build-homepage-css.mjs'
      - 'lawai_header_scroll.js'
      - 'lawai_runtime.js'
      - 'assets/images/**'
      - '.github/workflows/lawai-css-check.yml'
  pull_request:
    paths:
      - 'lawai_contral.css'
      - 'lawai_contral.min.css'
      - 'scripts/build-css.mjs'
      - 'scripts/verify-homepage.mjs'
      - 'index.html'
      - 'lawai_feature_glass.css'
      - 'lawai_footer_premium.css'
      - 'lawai_home_header.css'
      - 'lawai_header_premium.css'
      - 'scripts/build-homepage-css.mjs'
      - 'lawai_header_scroll.js'
      - 'lawai_runtime.js'
      - 'assets/images/**'
      - '.github/workflows/lawai-css-check.yml'
jobs:
  css-bundle-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Verify generated CSS is in sync
        run: node scripts/build-homepage-css.mjs --check
      - name: Check homepage LCP priorities and local assets
        run: node scripts/verify-homepage.mjs
