name: LawAI production API smoke test and full source exports
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/lawai-smoke-and-backup.yml'
jobs:
  verify-and-export:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    permissions:
      contents: read
    steps:
      - name: Python syntax and external API smoke test
        run: |
          import json, urllib.request, urllib.error, sys, time
          cases = [
              ("AI Robot / Luna", "https://airobot-br7n.onrender.com/airobot/api/generate", {
                "messages": [{"role": "user", "content": "這是虛構測試：租約期滿後房東尚未退還押金。請用繁體中文，簡短列出要確認的兩件事。"}]
              }),
              ("AI Report / Luna 追問", "https://flask-law-ai.onrender.com/airobot/api/generate", {
                "model": "gpt-6-luna",
                "messages": [{"role": "user", "content": "請針對『租屋期滿房東未退押金』設計三個釐清問題，每題三個合理可能情境，需避免將未知金額日期當成已確認事實。僅輸出JSON：{\\\"status\\\":\\\"法律問題\\\",\\\"questions\\\":[{\\\"q\\\":\\\"...\\\",\\\"options\\\":[\\\"...\\\",\\\"...\\\",\\\"...\\\"]}]}。"}]
              }),
              ("AI Report / Terra 報告", "https://flask-law-ai.onrender.com/aireport/api/opinion", {
                "chosenScenario": "租約期滿房東尚未退還押金，金額與日期不詳。這是虛構測試案例。",
                "followups": [
                  {"q":"是否已退租與交屋？"},
                  {"q":"房東有提出扣款理由嗎？"},
                  {"q":"是否有押金交付證明？"}
                ],
                "answersMeta": [
                  {"selectedText":"可能已交還房屋，但交屋細節尚待確認。","customText":"未提供具體交屋日。"},
                  {"selectedText":"房東的扣款理由尚待確認。","customText":"未提供金額。"},
                  {"selectedText":"可能留有租約或匯款紀錄。","customText":"目前未提供證據。"}
                ]
              })
          ]
          failures = []
          for name, url, payload in cases:
              data = json.dumps(payload, ensure_ascii=False).encode("utf-8")
              req = urllib.request.Request(url, data=data, headers={"Content-Type":"application/json","User-Agent":"LawAI-External-Smoke-Test/1.0"}, method="POST")
              try:
                  with urllib.request.urlopen(req,timeout=110) as resp:
                      raw = resp.read(150000)
                      body = json.loads(raw.decode("utf-8"))
                      content = ((body.get("choices") or [{}])[0].get("message") or {}).get("content")
                      assert isinstance(content,str) and len(content.strip()) > 10, f"Missing message content in {str(body)[:400]}"
                      if "追問" in name:
                          cleaned = content.strip()
                          if cleaned.startswith("```"):
                              cleaned = cleaned.split("\\n",1)[-1].rsplit("```",1)[0]
                          follow = json.loads(cleaned)
                          assert isinstance(follow.get("questions"),list) and len(follow["questions"])>=3, "Follow-up JSON questions missing"
                      print(f"PASS {name}: HTTP {resp.status}; content_chars={len(content)}")
              except Exception as err:
                  msg = f"FAIL {name}: {type(err).__name__}: {err}"
                  if isinstance(err, urllib.error.HTTPError):
                      msg += " | response=" + err.read(2000).decode("utf-8","replace")
                  print(msg)
                  failures.append(msg)
          if failures:
              raise SystemExit("Smoke test failed: " + "; ".join(failures))
          print("All three live external API calls passed.")
          
      - name: Package complete website and each backend repository
        if: always()
        run: |
          set -euo pipefail
          mkdir -p export bundles
          git clone --quiet --depth 1 "https://github.com/tony76426/LAWAI-.git" "export/LAWAI-"
          git -C "export/LAWAI-" archive --format=zip --output="$(pwd)/bundles/LAWAI--complete.zip" HEAD
          git clone --quiet --depth 1 "https://github.com/tony76426/AIrobot.git" "export/AIrobot"
          git -C "export/AIrobot" archive --format=zip --output="$(pwd)/bundles/AIrobot-complete.zip" HEAD
          git clone --quiet --depth 1 "https://github.com/tony76426/flask-law-ai.git" "export/flask-law-ai"
          git -C "export/flask-law-ai" archive --format=zip --output="$(pwd)/bundles/flask-law-ai-complete.zip" HEAD
          git clone --quiet --depth 1 "https://github.com/tony76426/Publish-Task.git" "export/Publish-Task"
          git -C "export/Publish-Task" archive --format=zip --output="$(pwd)/bundles/Publish-Task-complete.zip" HEAD
          git clone --quiet --depth 1 "https://github.com/tony76426/lawyer-booking-api.git" "export/lawyer-booking-api"
          git -C "export/lawyer-booking-api" archive --format=zip --output="$(pwd)/bundles/lawyer-booking-api-complete.zip" HEAD
          git clone --quiet --depth 1 "https://github.com/tony76426/postgresql-API.git" "export/postgresql-API"
          git -C "export/postgresql-API" archive --format=zip --output="$(pwd)/bundles/postgresql-API-complete.zip" HEAD
          git clone --quiet --depth 1 "https://github.com/tony76426/LawAi-robot.git" "export/LawAi-robot"
          git -C "export/LawAi-robot" archive --format=zip --output="$(pwd)/bundles/LawAi-robot-complete.zip" HEAD
          zip -d bundles/flask-law-ai-complete.zip .env || true
          ls -lh bundles/
          
      - name: Upload separated ZIP backups
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lawai-full-source-zips
          path: bundles/*.zip
          if-no-files-found: error
          retention-days: 30
