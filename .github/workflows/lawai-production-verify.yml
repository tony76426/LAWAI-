name: LawAI production homepage resources and Lighthouse
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'index.html'
      - 'lawai_feature_glass.css'
      - 'lawai_footer_premium.css'
      - 'lawai_home_header.css'
      - 'lawai_header_premium.css'
      - 'scripts/build-homepage-css.mjs'
      - 'lawai_header_scroll.js'
      - 'lawai_runtime.js'
      - 'lawai_contral.css'
      - 'lawai_contral.min.css'
      - 'scripts/build-css.mjs'
      - 'scripts/verify-homepage.test.mjs'
      - 'scripts/verify-homepage.mjs'
      - '.github/workflows/lawai-production-verify.yml'
  push:
    branches: [main]
    paths:
      - 'lawai_contral.css'
      - 'scripts/build-css.mjs'
      - 'scripts/verify-homepage.test.mjs'
      - 'index.html'
      - 'lawai_feature_glass.css'
      - 'lawai_footer_premium.css'
      - 'lawai_home_header.css'
      - 'lawai_header_premium.css'
      - 'scripts/build-homepage-css.mjs'
      - 'lawai_header_scroll.js'
      - 'lawai_runtime.js'
      - 'lawai_contral.min.css'
      - 'scripts/verify-homepage.mjs'
      - '.github/workflows/lawai-production-verify.yml'

permissions:
  contents: read
  actions: read

jobs:
  homepage-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Verify candidate CSS and homepage locally
        run: |
          node scripts/build-homepage-css.mjs --check
          node scripts/verify-homepage.mjs
          node --test scripts/verify-homepage.test.mjs
      - name: Wait for successful Pages deployment of this exact commit
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 40); do
            result=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/runs" -f head_sha="$GITHUB_SHA" -f per_page=100 --jq '[.workflow_runs[] | select(.name == "pages build and deployment" and .head_branch == "main")] | sort_by(.created_at) | last // {} | [.status // "pending", .conclusion // "", .html_url // ""] | join("|")')
            IFS='|' read -r status conclusion url <<< "$result"
            echo "Pages deployment for $GITHUB_SHA: $status $conclusion $url"
            if [ "$status" = completed ]; then
              [ "$conclusion" = success ] || exit 1
              exit 0
            fi
            sleep 15
          done
          echo "::error::No successful Pages deployment for $GITHUB_SHA"
          exit 1
      - name: Verify published CSS, LCP resources and destinations
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          for attempt in 1 2 3 4 5 6; do
            if node scripts/verify-homepage.mjs --production; then exit 0; fi
            if [ "$attempt" -eq 6 ]; then exit 1; fi
            echo "Production may still be deploying; retrying read-only checks..."
            sleep 30
          done
      - name: Lighthouse mobile + desktop (report only)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          mkdir -p reports
          export CHROME_PATH="$(command -v google-chrome || command -v chromium)"
          test -n "$CHROME_PATH"
          npx --yes lighthouse@12 https://www.lawfavor.com/ \
            --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
            --only-categories=performance --output=json \
            --output-path=reports/lighthouse-mobile.json --quiet
          npx --yes lighthouse@12 https://www.lawfavor.com/ \
            --preset=desktop \
            --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
            --only-categories=performance --output=json \
            --output-path=reports/lighthouse-desktop.json --quiet
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          for (const mode of ['mobile','desktop']) {
            const data=JSON.parse(readFileSync('reports/lighthouse-'+mode+'.json','utf8'));
            console.log(mode+' Lighthouse performance score: '+Math.round(100*data.categories.performance.score));
            console.log(mode+' LCP: '+(data.audits['largest-contentful-paint']?.displayValue||'not available'));
            console.log(mode+' CLS: '+(data.audits['cumulative-layout-shift']?.displayValue||'not available'));
          }
          NODE
      - name: Save Lighthouse machine reports
        if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v5
        with:
          name: lawai-homepage-lighthouse-reports
          path: reports/*.json
          if-no-files-found: ignore
          retention-days: 14
